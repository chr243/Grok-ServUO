
# The displayed name of the shard
Name=Grok ServUO

# The internal IP address to listen on.
# You can leave this value as default to listen to all available IP's.
@Listen=0.0.0.0

# Address is the IP put in the shard-list packet. Never 127.0.0.1 on a public host.
# Contabo public IPv4 — remote clients connect to this address.
@Address=161.97.74.234

# The Port to bind the Listener to.
# Default: 2593
@Port=2593
